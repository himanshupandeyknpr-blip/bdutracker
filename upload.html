<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Excel Files for GIL Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f7fa;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    background: #fff;
    border-radius: 16px;
    padding: 40px;
    max-width: 500px;
    width: 100%;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    text-align: center;
  }
  h1 { font-size: 22px; color: #16213e; margin-bottom: 6px; }
  .subtitle { font-size: 14px; color: #64748b; margin-bottom: 30px; }
  .dropzone {
    border: 2px dashed #cbd5e1;
    border-radius: 12px;
    padding: 50px 20px;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 20px;
  }
  .dropzone:hover, .dropzone.dragover {
    border-color: #3b82f6;
    background: #eff6ff;
  }
  .dropzone .icon { font-size: 40px; margin-bottom: 12px; }
  .dropzone .text { font-size: 15px; color: #475569; }
  .dropzone .hint { font-size: 12px; color: #94a3b8; margin-top: 6px; }
  #fileList {
    text-align: left;
    margin-bottom: 20px;
  }
  .file-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: #f8fafc;
    border-radius: 8px;
    margin-bottom: 6px;
    font-size: 13px;
  }
  .file-row .name { color: #16213e; font-weight: 500; }
  .file-row .size { color: #94a3b8; font-size: 12px; }
  .file-row .status { font-size: 12px; }
  .status.ok { color: #16a34a; }
  .status.err { color: #dc2626; }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  button.primary {
    background: #3b82f6;
    color: #fff;
  }
  button.primary:hover { background: #2563eb; }
  button.primary:disabled { background: #94a3b8; cursor: not-allowed; }
  .msg {
    margin-top: 16px;
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
  }
  .msg.success { background: #dcfce7; color: #166534; display: block; }
  .msg.error { background: #fef2f2; color: #991b1b; display: block; }
  input[type="file"] { display: none; }
</style>
</head>
<body>
<div class="container">
  <h1>GIL Dashboard - Upload Excel Files</h1>
  <p class="subtitle">Drag &amp; drop your .xlsx or .xls files here</p>

  <div class="dropzone" id="dropzone">
    <div class="icon">&#128196;</div>
    <div class="text">Drop Excel files here or click to browse</div>
    <div class="hint">Accepts .xlsx and .xls files</div>
  </div>
  <input type="file" id="fileInput" multiple accept=".xlsx,.xls">

  <div id="fileList"></div>

  <button class="primary" id="uploadBtn" disabled>Upload to Workspace</button>

  <div class="msg" id="msg"></div>
</div>

<script>
var selectedFiles = [];

var dz = document.getElementById("dropzone");
var input = document.getElementById("fileInput");
var btn = document.getElementById("uploadBtn");
var list = document.getElementById("fileList");
var msg = document.getElementById("msg");

dz.addEventListener("click", function() { input.click(); });

dz.addEventListener("dragover", function(e) { e.preventDefault(); dz.classList.add("dragover"); });
dz.addEventListener("dragleave", function() { dz.classList.remove("dragover"); });
dz.addEventListener("drop", function(e) {
  e.preventDefault();
  dz.classList.remove("dragover");
  handleFiles(e.dataTransfer.files);
});

input.addEventListener("change", function() {
  handleFiles(input.files);
});

function handleFiles(files) {
  selectedFiles = [];
  for (var i = 0; i < files.length; i++) {
    var f = files[i];
    var ext = f.name.split(".").pop().toLowerCase();
    if (ext === "xlsx" || ext === "xls") {
      selectedFiles.push(f);
    }
  }
  renderList();
  btn.disabled = selectedFiles.length === 0;
}

function renderList() {
  if (selectedFiles.length === 0) { list.innerHTML = ""; return; }
  list.innerHTML = selectedFiles.map(function(f, i) {
    return '<div class="file-row">' +
      '<span class="name">' + f.name + '</span>' +
      '<span class="size">' + formatSize(f.size) + '</span>' +
      '<span class="status" id="st' + i + '"></span>' +
      '</div>';
  }).join("");
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / 1048576).toFixed(1) + " MB";
}

btn.addEventListener("click", function() {
  btn.disabled = true;
  btn.textContent = "Uploading...";
  msg.className = "msg";
  msg.style.display = "none";

  var uploaded = 0;
  var total = selectedFiles.length;

  function uploadNext() {
    if (uploaded >= total) {
      btn.textContent = "Upload to Workspace";
      msg.className = "msg success";
      msg.textContent = "All " + total + " file(s) uploaded successfully. Return to the AI chat and tell it the files are ready.";
      return;
    }

    var f = selectedFiles[uploaded];
    var formData = new FormData();
    formData.append("file", f);

    fetch("/upload", { method: "POST", body: formData })
      .then(function(r) {
        var st = document.getElementById("st" + uploaded);
        if (r.ok) {
          st.textContent = "OK";
          st.className = "status ok";
        } else {
          st.textContent = "Failed";
          st.className = "status err";
        }
        uploaded++;
        uploadNext();
      })
      .catch(function() {
        var st = document.getElementById("st" + uploaded);
        st.textContent = "Failed";
        st.className = "status err";
        uploaded++;
        uploadNext();
      });
  }

  uploadNext();
});
</script>
</body>
</html>
